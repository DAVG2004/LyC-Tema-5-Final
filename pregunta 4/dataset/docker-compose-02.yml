version: '3.8'

services:
  web:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
