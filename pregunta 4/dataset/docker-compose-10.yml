version: '3.8'

services:
  edge-router:
    image: envoyproxy/envoy:v1.26.0
    ports:
      - "80:80"
      - "443:443"
      - "9901:9901"

  identity-provider:
    image: keycloak/keycloak:21.1
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin

  tenant-service:
    image: cloud/tenant-service:5.0

  billing-service:
    image: cloud/billing-service:2.4

  analytics-engine:
    image: cloud/analytics:1.0

  reporting-worker:
    image: cloud/reporter:3.1

  notification-hub:
    image: cloud/notifications:2.0

  storage-proxy:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z

  cache-layer-1:
    image: memcached:1.6-alpine

  cache-layer-2:
    image: redis:7-alpine

  event-bus:
    image: confluentinc/cp-kafka:7.4.0

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0

  db-shard-1:
    image: postgres:15-alpine

  db-shard-2:
    image: postgres:15-alpine

  monitoring-agent:
    image: datadog/agent:latest
